name: Build and Deploy HTML5

# HTML5 release pipeline: build and deploy the current main branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent older HTML5 deployments from racing the newest build.
concurrency:
  group: github-pages-html5-v2
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  html5:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.1.5

      - name: Verify Haxe toolchain
        shell: bash
        run: |
          set -e
          haxe -version
          haxelib version

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.9.0

          haxelib run lime setup
          haxelib run lime setup flixel

          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.5.0
          haxelib set hscript 2.4.0
          haxelib set actuate 1.9.0

          echo "=== Selected Haxe libraries ==="
          haxelib list
          echo "=== hscript path ==="
          haxelib path hscript
          echo "=== lime path ==="
          haxelib path lime
          echo "=== openfl path ==="
          haxelib path openfl

          # The old Lime/OpenFL web preloader reads preload flags from
          # dependency include.xml files at compile time. Disable every
          # dependency preload flag before generating the HTML5 manifest.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          packages = ["flixel", "flixel-ui", "flixel-addons", "actuate"]

          for package in packages:
              root = Path(subprocess.check_output(
                  ["haxelib", "path", package], text=True
              ).splitlines()[0].strip())

              changed = 0
              for include in root.rglob("include.xml"):
                  text = include.read_text()
                  if 'preload="true"' in text:
                      text = text.replace('preload="true"', 'preload="false"')
                      include.write_text(text)
                      changed += 1

              print(f"Patched {package}: {changed} include.xml file(s)")
          PY

      - name: Build HTML5
        shell: bash
        run: |
          set -e
          haxelib run lime build html5

      - name: Verify HTML5 preload data
        shell: bash
        run: |
          set -e
          ROOT="export/release/html5/bin"
          JS="$ROOT/AccelerantKE.js"

          test -f "$JS"
          test -s "$JS"
          test -f "$ROOT/index.html"

          # Lime embeds the manifest inside the compiled JavaScript. This is
          # the data the FlxPreloader actually uses, so verify the compiled
          # program itself has no true preload records.
          PRELOAD_COUNT="$(grep -o 'y7:preloadt' "$JS" | wc -l || true)"
          echo "Compiled JS preload=true records: $PRELOAD_COUNT"
          if [ "$PRELOAD_COUNT" -ne 0 ]; then
            echo "ERROR: compiled JavaScript still contains blocking preload records."
            exit 1
          fi

          for manifest in default game songs shared fonts; do
            test -f "$ROOT/manifest/$manifest.json"
          done

          touch "$ROOT/.nojekyll"
          echo "Verified HTML5 build without embedded preload=true records."

      - name: Sanitize generated manifest files
        shell: bash
        run: |
          set -e
          ROOT="export/release/html5/bin"

          # Keep the loose manifests consistent with the compiled JS.
          python3 - "$ROOT/manifest" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          for path in root.glob("*.json"):
              text = path.read_text()
              if "y7:preloadt" in text:
                  path.write_text(text.replace("y7:preloadt", ""))
                  print("Sanitized", path)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/release/html5/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
