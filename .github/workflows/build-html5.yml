name: Build and Deploy HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: github-pages-html5-v2
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  html5:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.1.5

      - name: Verify Haxe toolchain
        shell: bash
        run: |
          set -e
          haxe -version
          haxelib version

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.9.0

          haxelib run lime setup
          haxelib run lime setup flixel

          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.5.0
          haxelib set hscript 2.4.0
          haxelib set actuate 1.9.0

      - name: Build HTML5
        shell: bash
        run: |
          set -e
          haxelib run lime build html5

      - name: Verify HTML5 manifests
        shell: bash
        run: |
          set -e
          ROOT="export/release/html5/bin"
          JS="$ROOT/AccelerantKE.js"
          MANIFEST="$ROOT/manifest"

          test -f "$JS"
          test -s "$JS"
          test -f "$ROOT/index.html"

          for manifest in default startup shared songs; do
            test -f "$MANIFEST/$manifest.json"
          done

          python3 - "$MANIFEST" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          root = Path(sys.argv[1])

          def read_manifest(name):
              path = root / f"{name}.json"
              data = json.loads(path.read_text())
              assets = data.get("assets", "")
              if not isinstance(assets, str):
                  raise SystemExit(f"{name}.json has unexpected assets format")
              # Lime 7.9's Haxe serializer URL-escapes strings such as
              # assets/images/... as assets%2Fimages%2F..., so decode before
              # checking which asset tree each library actually owns.
              return data, unquote(assets)

          _, default_assets = read_manifest("default")
          _, startup_assets = read_manifest("startup")
          _, shared_assets = read_manifest("shared")
          _, songs_assets = read_manifest("songs")

          forbidden_default = (
              "assets/preload",
              "assets/shared",
              "assets/songs",
              "assets/fonts",
          )
          for marker in forbidden_default:
              if marker in default_assets:
                  raise SystemExit(
                      f"default.json unexpectedly contains project asset tree: {marker}"
                  )

          for marker in ("assets/images/", "assets/data/", "assets/sounds/", "assets/fonts/"):
              if marker not in startup_assets:
                  raise SystemExit(
                      f"startup.json is missing expected startup assets: {marker}"
                  )

          for marker, name, assets in (
              ("assets/shared/", "shared", shared_assets),
              ("assets/songs/", "songs", songs_assets),
          ):
              if marker not in assets:
                  raise SystemExit(f"{name}.json is missing expected root: {marker}")

          sizes = {
              name: (root / f"{name}.json").stat().st_size
              for name in ("default", "startup", "shared", "songs")
          }
          print("Manifest sizes:", sizes)
          print("Verified startup preloads and lazy shared/song libraries.")
          PY

          touch "$ROOT/.nojekyll"
          echo "HTML5 build and manifest structure verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/release/html5/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
