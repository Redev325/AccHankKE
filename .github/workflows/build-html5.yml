name: Build and Deploy HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent older HTML5 deployments from racing the newest build.
concurrency:
  group: github-pages-html5
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  html5:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.1.5

      - name: Verify Haxe toolchain
        shell: bash
        run: |
          set -e
          haxe -version
          haxelib version

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.9.0

          haxelib run lime setup
          haxelib run lime setup flixel

          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib set flixel-ui 2.5.0
          haxelib set hscript 2.4.0
          haxelib set actuate 1.9.0

          echo "=== Selected Haxe libraries ==="
          haxelib list
          echo "=== hscript path ==="
          haxelib path hscript
          echo "=== lime path ==="
          haxelib path lime
          echo "=== openfl path ==="
          haxelib path openfl

          # Lime 7.9's HTML5 preloader waits on assets marked preload in
          # dependency include.xml files. Keep package assets lazy and let
          # the game request them when needed after the normal FlxPreloader.
          python3 - <<'PY'
import subprocess
from pathlib import Path

packages = ["flixel", "flixel-ui"]

for package in packages:
    root = subprocess.check_output(
        ["haxelib", "path", package], text=True
    ).splitlines()[0].strip()
    include = Path(root) / "include.xml"

    if not include.exists():
        raise SystemExit(f"Missing include.xml for {package}: {include}")

    text = include.read_text()
    lines = text.splitlines()
    changed = 0

    for i, line in enumerate(lines):
        if "<assets " in line and "preload=" not in line and line.rstrip().endswith("/>"):
            lines[i] = line.rstrip()[:-2] + ' preload="false" />'
            changed += 1

    if changed == 0:
        raise SystemExit(f"No asset declarations were patched in {include}")

    include.write_text("\n".join(lines) + "\n")
    print(f"Patched {package}: {include} ({changed} asset declarations)")

    verify = include.read_text()
    if '<assets ' in verify and 'preload="true"' in verify:
        raise SystemExit(f"Found preload=true in patched {package} include.xml")
PY

          echo "=== HaxeFlixel include.xml ==="
          FLIXEL_DIR="$(haxelib path flixel | head -n 1)"
          grep -E '<assets |nokiafc22|monsterrat' "$FLIXEL_DIR/include.xml"

          echo "=== FlxUI include.xml ==="
          FLIXEL_UI_DIR="$(haxelib path flixel-ui | head -n 1)"
          grep -E '<assets |flixel-ui' "$FLIXEL_UI_DIR/include.xml"

      - name: Build HTML5
        shell: bash
        run: |
          set -e
          haxelib run lime build html5

      - name: Verify HTML5 output
        shell: bash
        run: |
          set -e
          test -f export/release/html5/bin/index.html
          test -f export/release/html5/bin/manifest/default.json
          test -f export/release/html5/bin/manifest/game.json
          touch export/release/html5/bin/.nojekyll

          python3 - <<'PY'
import json
from pathlib import Path

root = Path("export/release/html5/bin/manifest")
default = json.loads((root / "default.json").read_text())
game = json.loads((root / "game.json").read_text())

default_assets = default.get("assets", "")
if "y7:preloadt" in default_assets:
    raise SystemExit("HTML5 default manifest still contains preload=true assets")

print("HTML5 default preloaded assets: 0")
print("HTML5 game manifest present:", len(game.get("assets", "")) > 0)
PY

          echo "HTML5 build ready:"
          ls -lah export/release/html5/bin | head -40

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/release/html5/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
