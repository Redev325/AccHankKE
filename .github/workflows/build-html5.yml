name: Build and Deploy HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent older HTML5 deployments from racing the newest build.
concurrency:
  group: github-pages-html5
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  html5:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.1.5

      - name: Verify Haxe toolchain
        shell: bash
        run: |
          set -e
          haxe -version
          haxelib version

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.9.0

          haxelib run lime setup
          haxelib run lime setup flixel

          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib set hscript 2.4.0
          haxelib set actuate 1.9.0

          echo "=== Selected Haxe libraries ==="
          haxelib list
          echo "=== hscript path ==="
          haxelib path hscript
          echo "=== lime path ==="
          haxelib path lime
          echo "=== openfl path ==="
          haxelib path openfl

          # Lime 7.9's HTML5 preloader waits on assets marked preload in
          # HaxeFlixel's include.xml. Keep Flixel's helper fonts/audio lazy;
          # the Flixel preloader graphics are embedded in FlxPreloader itself.
          FLIXEL_DIR="$(haxelib path flixel | head -n 1)"
          python3 - "$FLIXEL_DIR/include.xml" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()

# Only change the four HaxeFlixel core assets that are preloaded on web.
targets = [
    '<assets path="assets/sounds" rename="flixel/sounds" include="*.mp3" if="web || air" embed="true" />',
    '<assets path="assets/sounds" rename="flixel/sounds" include="*.ogg" unless="flash || air" embed="true" />',
    '<assets path="assets/fonts/nokiafc22.ttf" rename="flixel/fonts/nokiafc22.ttf" embed="true" />',
    '<assets path="assets/fonts/monsterrat.ttf" rename="flixel/fonts/monsterrat.ttf" embed="true" />',
]
missing = [target for target in targets if target not in text]
if missing:
    raise SystemExit("HaxeFlixel include.xml layout changed; expected preload declarations were not found: " + repr(missing))

for target in targets:
    text = text.replace(target, target[:-3] + ' preload="false" />')

path.write_text(text)
PY

          echo "=== Patched HaxeFlixel include.xml ==="
          grep -E 'flixel/sounds|nokiafc22|monsterrat' "$FLIXEL_DIR/include.xml"

      - name: Build HTML5
        shell: bash
        run: |
          set -e
          haxelib run lime build html5

      - name: Verify HTML5 output
        shell: bash
        run: |
          set -e
          test -f export/release/html5/bin/index.html
          touch export/release/html5/bin/.nojekyll
          echo "HTML5 build ready:"
          ls -lah export/release/html5/bin | head -40

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/release/html5/bin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
