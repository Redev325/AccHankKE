name: Build HTML5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  html5:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y neko git wget tar

      - name: Install Haxe 4.1.5
        shell: bash
        run: |
          wget -q https://github.com/HaxeFoundation/haxe/releases/download/4.1.5/haxe-4.1.5-linux64.tar.gz
          mkdir -p "$HOME/haxe"
          tar -xzf haxe-4.1.5-linux64.tar.gz -C "$HOME/haxe"
          echo "$HOME/haxe/haxe_20201231082044_5e33a78aa" >> "$GITHUB_PATH"
          echo "HAXE_INSTALLDIR=$HOME/haxe/haxe_20201231082044_5e33a78aa" >> "$GITHUB_ENV"

      - name: Configure Haxelib
        shell: bash
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Haxe libraries
        shell: bash
        run: |
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-tools 1.5.1
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.5.0
          haxelib install hscript 2.4.0
          haxelib install actuate 1.9.0
          haxelib install newgrounds 2.0.3

          # Force the legacy versions instead of whatever newer versions are also installed.
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-addons 2.11.0
          haxelib list
          echo "Resolved hscript:"
          haxelib path hscript
          echo "Resolved lime:"
          haxelib path lime
          echo "Resolved openfl:"
          haxelib path openfl
          haxelib run lime build html5
          haxelib set actuate 1.9.0
          haxelib set newgrounds 2.0.3

          haxelib run lime setup
          haxelib run lime setup flixel

      - name: Build HTML5
        shell: bash
        run: |
          haxelib list
          haxelib run lime build html5

      - name: Upload HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: AccHankKE-HTML5
          path: export/release/html5/bin
          if-no-files-found: error
